name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project DailyLog.xcodeproj \
            -scheme DailyLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DailyLog.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload DailyLog-unsigned.ipa
          mkdir -p Payload
          cp -R "DailyLog.xcarchive/Products/Applications/DailyLog.app" Payload/
          zip -qry DailyLog-unsigned.ipa Payload
          ls -lh DailyLog-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyLog-unsigned-ipa
          path: ${{ runner.temp }}/DailyLog-unsigned.ipa
          if-no-files-found: error
